# Household infeasible items: missing-object instructions (gold action: refuse), authored for this
# benchmark. The instruction needs an object that the scene does not contain: an object of a kind that is
# in view, in a variant that the scene does not list (src/build_data.py, kitchen_scene: for a kind of
# object that is in view, the listed objects are the only ones).
# Fields:
#   ambik_id      the AmbiK row whose kitchen scene (environment list) the item uses; never a row of the
#                 kept AmbiK clear/ambiguous pairs. The scene is read from AmbiK at build time.
#   kind          the object kind; in_view: the listed objects of that kind (names as in the AmbiK list);
#                 requested: the variant the instruction needs, which is not listed.
#   scene_edits   listed objects whose precise name the label needs (a missing attribute is not proof of
#                 absence), e.g. "a greek yogurt cup" -> "a plain unflavoured greek yogurt cup". The names
#                 come from data/object_names.yaml, which the build applies to every kitchen scene; `new`
#                 must equal that name (checked by the build).
#   text          the instruction, written for this benchmark; or
#   text_from_ambik  the instruction as edits of the row's own AmbiK unambiguous task (stripped of
#                 surrounding whitespace): a list of [start, end, replacement] character spans, applied
#                 by the build after AmbiK is downloaded (AmbiK states no licence, so its text is not
#                 redistributed here). The build also stores that AmbiK task in meta.based_on.
#   why           why the instruction cannot be carried out.
#   replaces      this item takes the split of the listed item, which is not used.
#   ok: false     the item is not used (note gives the reason); it still takes part in the grouping and
#                 the split, so that every used item keeps its split.

