# Precise object names for the kitchen scenes, applied by src/build_data.py to the objects_in_view of
# EVERY kitchen scene (AmbiK clear and ambiguous items and the constructed infeasible items), so that one
# object has one name in every scene and the narrowing words of the infeasible items are not a cue to
# the condition. Keys are listed objects without their article ("a", "an"), compared case-insensitively;
# the article of the scene's entry is kept and adjusted. Names are positive descriptions of the listed
# object; none names a missing variant.
# `skip`: item ids whose scene keeps the source name for that object, because the precise name would
# change the item's label or resolve its intended ambiguity.
# Every replacement is logged by the build in data/review/inventory_edits.csv (edit_kind: narrowing =
# needed for an infeasible item's label, declared in its scene_edits; propagation = same name carried to
# the scene).

names:
  greek yogurt cup: {new: plain unflavoured greek yogurt cup, why: "flavour of the listed yogurt made explicit"}
  greek yogurt: {new: plain unflavoured Greek dairy yogurt, why: "flavour and dairy base of the listed yogurt made explicit"}
  black tea: {new: plain black tea, why: "listed tea is unflavoured"}
  green tea: {new: plain green tea, why: "listed tea is unflavoured"}
  black tea bags: {new: plain black tea bags, why: "listed tea is unflavoured"}
  green tea bags: {new: plain green tea bags, why: "listed tea is unflavoured"}
  bottle of white wine: {new: bottle of still unfortified white wine, why: "listed wine is still and unfortified"}
