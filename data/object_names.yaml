  bottled milk: {new: bottle of cow's milk, why: "same object; shared name"}
  bottle of milk: {new: bottle of cow's milk, why: "same object; shared name"}
  red wine bottle: {new: bottle of still unfortified red wine, why: "same object; shared name"}
