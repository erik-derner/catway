# Items of the new domains and TRUST-NAV that were shown to a model while the probe formats were
# developed. src/analyze.py leaves them out of every evaluation (pilot_excluded_ids): a listed id
# excludes its round-one item, a listed round-two id (<base>#r2) excludes its base, round-two items
# follow their base, and TRUST-NAV ids also exclude their trustnav_complete twins (<id>+c). The
# tables report them separately in the *_incl_pilot_seen sensitivity rows. Household items of this kind
# are kept in the calibration split by src/build_data.py and are not listed here.
